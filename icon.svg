  <line x1="210" y1="100" x2="210" y2="340" stroke="#fde68a" stroke-width="2" opacity="0.6"/>
  <line x1="216" y1="100" x2="216" y2="340" stroke="#fde68a" stroke-width="1.5" opacity="0.5"/>
