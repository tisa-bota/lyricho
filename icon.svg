<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#13151c"/>
  <rect x="30" y="30" width="452" height="452" rx="80" fill="#1c1f28"/>
  <!-- ギター本体 -->
  <ellipse cx="210" cy="330" rx="90" ry="100" fill="#252a36" stroke="#c084fc" stroke-width="8"/>
  <ellipse cx="210" cy="330" rx="55" ry="62" fill="#13151c" stroke="#6ee7c7" stroke-width="4"/>
  <!-- ネック -->
  <rect x="196" y="120" width="28" height="220" rx="14" fill="#252a36" stroke="#c084fc" stroke-width="6"/>
  <!-- ヘッド -->
  <rect x="184" y="88" width="52" height="52" rx="10" fill="#1c1f28" stroke="#c084fc" stroke-width="5"/>
  <!-- フレット -->
  <line x1="196" y1="175" x2="224" y2="175" stroke="#6ee7c7" stroke-width="4"/>
  <line x1="196" y1="210" x2="224" y2="210" stroke="#6ee7c7" stroke-width="4"/>
